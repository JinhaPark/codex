name: Validate affected travel guide scope

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "scripts/**"
      - "shared/**"
      - "tantantan/**"
      - "caucasus/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed dependency scopes
        id: scope
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.sha }}"
          tantantan=false
          caucasus=false
          while IFS= read -r path; do
            case "$path" in
              tantantan/*)
                tantantan=true
                ;;
              caucasus/*)
                caucasus=true
                ;;
              shared/*|scripts/*|index.html|package.json|package-lock.json|vite.config.js|.github/workflows/validate.yml)
                tantantan=true
                caucasus=true
                ;;
            esac
          done < <(git diff --name-only "$base" "$head")
          echo "tantantan=$tantantan" >> "$GITHUB_OUTPUT"
          echo "caucasus=$caucasus" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.tantantan == 'true'
        with:
          python-version: "3.12"
      - name: Install Tantantan image test dependencies
        if: steps.scope.outputs.tantantan == 'true'
        run: python -m pip install -r tantantan/scripts/requirements-image-cache.txt

      - name: Test Tantantan
        if: steps.scope.outputs.tantantan == 'true'
        run: node --test tantantan/tests/*.test.js
        env:
          IMAGE_LINEAGE_BASE: ${{ github.event.pull_request.base.sha }}

      - name: Test Caucasus
        if: steps.scope.outputs.caucasus == 'true'
        run: node --test caucasus/tests/*.test.js

      - run: npm run build
      - run: node scripts/verify-travel-build.mjs
