name: Validate travel guide PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-image-cache.txt
      - run: npm test
        env:
          IMAGE_LINEAGE_BASE: ${{ github.event.pull_request.base.sha }}
      - run: npm run build
