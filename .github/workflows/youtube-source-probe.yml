name: Check YouTube sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kakaotalk/youtube/**"
      - ".github/workflows/youtube-source-probe.yml"
  pull_request:
    branches: [main]
    paths:
      - "kakaotalk/youtube/**"
      - ".github/workflows/youtube-source-probe.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s kakaotalk/youtube/tests -v

  probe:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r kakaotalk/youtube/requirements.txt
      - name: Discover videos and test public Korean captions
        run: python kakaotalk/youtube/probe.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-source-probe
          path: probe-output/
          retention-days: 1
          if-no-files-found: warn
