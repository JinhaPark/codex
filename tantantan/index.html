<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142e39">
  <meta name="description" content="중앙아시아 탄탄탄 여행 가이드 October 12–21, 2026">
  <link rel="manifest" href="../manifest-tantantan.webmanifest">
  <title>중앙아시아 탄탄탄 | 2026 여행기</title>
  <style>
    .startup{box-sizing:border-box;max-width:34rem;margin:12vh auto;padding:2rem 1.5rem;color:#142e39;background:#f8f6ef;border:1px solid #e6e1d5;border-radius:1rem;font-family:system-ui,sans-serif;line-height:1.7;overflow-wrap:anywhere}
    .startup h1{font-size:1.5rem;line-height:1.4;margin:0 0 1rem}
    .startup p{margin:.75rem 0}
    .startup button{font:inherit;min-height:44px;padding:.6rem 1.2rem;color:#fff;background:#142e39;border:0;border-radius:.5rem;cursor:pointer}
    .startup button:focus-visible{outline:3px solid #b88b43;outline-offset:3px}
    .startup small{display:block;margin-top:1rem;color:#59656a}
  </style>
</head>
<body>
  <div id="app">
    <section class="startup" aria-label="여행 가이드 시작">
      <h1>중앙아시아 탄탄탄</h1>
      <div role="status" aria-live="polite" aria-atomic="true">
        <p id="startup-status">여행 가이드를 불러오고 있습니다.</p>
        <p id="startup-help">연결 상태에 따라 잠시 걸릴 수 있습니다.</p>
      </div>
      <button id="startup-retry" type="button" hidden>다시 불러오기</button>
      <small>다시 불러와도 저장된 준비물 체크는 삭제되지 않습니다.</small>
      <noscript><p>이 가이드를 이용하려면 브라우저의 JavaScript를 켜 주세요.</p></noscript>
    </section>
  </div>
  <script id="startup-script">
    (() => {
      const status = document.getElementById('startup-status');
      const help = document.getElementById('startup-help');
      const retry = document.getElementById('startup-retry');
      let ready = false;
      let failed = false;
      const explain = () => {
        if (ready) return;
        status.textContent = failed ? '여행 가이드를 불러오지 못했습니다.' : '불러오는 데 시간이 걸리고 있습니다.';
        help.textContent = navigator.onLine
          ? '조금 더 기다리시거나 다시 불러오기를 눌러 주세요. 연결이 불안정하면 Wi-Fi 또는 셀룰러 연결을 확인해 주세요.'
          : '현재 오프라인입니다. 처음 여는 기기이거나 필요한 자료가 저장되지 않았다면 인터넷에 연결한 뒤 다시 불러와 주세요.';
        retry.hidden = false;
      };
      const timer = setTimeout(explain, 12000);
      const failure = event => {
        if (ready) return;
        if (event.type === 'error' && event.target !== window && !(event.target?.tagName === 'SCRIPT' && event.target.type === 'module')) return;
        failed = true;
        clearTimeout(timer);
        explain();
      };
      const complete = () => {
        ready = true;
        clearTimeout(timer);
        window.removeEventListener('error', failure, true);
        window.removeEventListener('unhandledrejection', failure);
        window.removeEventListener('online', explain);
        window.removeEventListener('offline', explain);
      };
      retry.addEventListener('click', () => window.location.reload());
      window.addEventListener('error', failure, true);
      window.addEventListener('unhandledrejection', failure);
      window.addEventListener('online', explain);
      window.addEventListener('offline', explain);
      window.addEventListener('guide:ready', complete, {once:true});
      if (!navigator.onLine) explain();
    })();
  </script>
  <script id="app-entry" type="module" src="./src/main.js"></script>
</body>
</html>
