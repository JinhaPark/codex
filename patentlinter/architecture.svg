<rect x="223" y="101" width="173" height="131" rx="11" fill="#EAF1E9" stroke="#CAD2C8" stroke-width="1.5"/><text x="239" y="125" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#A05B34">02  STRUCTURE</text><text x="239" y="160" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#243e35">원문 관계 그래프</text><text x="239" y="190" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#596B61">세그먼트 × 용어</text><text x="239" y="211" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#596B61">출처 / 버전 고정</text>
