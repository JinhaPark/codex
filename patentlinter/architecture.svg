<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="ttl description"><title id="ttl">PatentLinter — decision boundaries</title><desc id="description">Conceptual PatentLinter flow from document processing through source graph, GraphRAG retrieval, DSPy reasoning, governed model proposals and human approval. The pydantic-graph target is not deployed.</desc><rect width="1200" height="500" fill="#FAF9F4"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52695F"/></marker></defs><text x="28" y="43" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#A05B34">ARCHITECTURE / CONTROLLED SEMANTIC REVIEW</text><text x="1172" y="43" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" text-anchor="end" fill="#647168">CONCEPTUAL · NOT A DEPLOYMENT CLAIM</text>
