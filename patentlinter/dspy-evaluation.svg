<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="ttl description"><title id="ttl">PatentLinter — DSPy evaluation protocol</title><desc id="description">Planned private golden-case split, DSPy signatures, prompt candidate comparison, held-out evaluation and adopt or reject. No measured optimization result is claimed.</desc><rect width="1200" height="210" fill="#FAF9F4"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#52695F"/></marker></defs><text x="28" y="32" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#A05B34">DSPy / PROMPT OPTIMIZATION EVALUATION</text><text x="1172" y="32" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="400" text-anchor="end" fill="#647168">PROPOSED EXPERIMENT · NO CLAIMED ACCURACY LIFT</text><rect x="20" y="60" width="210" height="120" rx="11" fill="#F2F2ED" stroke="#CAD2C8" stroke-width="1.5"/><text x="33" y="83" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#A05B34">01 · PRIVATE CASES</text><text x="33" y="125" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#243e35">비공개 사례 분리</text><text x="33" y="151" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#647168">훈련·평가 누출 방지</text><path d="M231 121 L256 121" fill="none" stroke="#52695F" stroke-width="2"  marker-end="url(#a)"/><rect x="258" y="60" width="210" height="120" rx="11" fill="#F2F2ED" stroke="#CAD2C8" stroke-width="1.5"/><text x="271" y="83" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#A05B34">02 · SIGNATURES</text><text x="271" y="125" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#243e35">역할별 입출력 계약</text><text x="271" y="151" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#647168">Planner · Reranker</text><path d="M469 121 L494 121" fill="none" stroke="#52695F" stroke-width="2"  marker-end="url(#a)"/><rect x="496" y="60" width="210" height="120" rx="11" fill="#FAEEE4" stroke="#CAD2C8" stroke-width="1.5"/><text x="509" y="83" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#A05B34">03 · CANDIDATES</text><text x="509" y="125" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#243e35">프롬프트 후보 비교</text><text x="509" y="151" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#647168">자동 최적화 검증 예정</text><path d="M707 121 L732 121" fill="none" stroke="#52695F" stroke-width="2"  marker-end="url(#a)"/><rect x="734" y="60" width="210" height="120" rx="11" fill="#F2F2ED" stroke="#CAD2C8" stroke-width="1.5"/><text x="747" y="83" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#A05B34">04 · HELD-OUT TEST</text><text x="747" y="125" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#243e35">근거·누락·판단 보류</text><text x="747" y="151" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="12" font-weight="400" text-anchor="start" fill="#647168">비용·지연 동시 평가</text><path d="M945 121 L970 121" fill="none" stroke="#52695F" stroke-width="2"  marker-end="url(#a)"/><rect x="972" y="60" width="210" height="120" rx="11" fill="#F2F2ED" stroke="#CAD2C8" stroke-width="1.5"/><text x="985" y="83" font-family="Arial, 'Noto Sans CJK KR', sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#A05B34">05 · 