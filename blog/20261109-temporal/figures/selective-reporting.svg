<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 550" role="img" aria-labelledby="title desc">
  <title id="title">Selective reporting through acknowledgements and references</title>
  <desc id="desc">A Worker sends an acknowledgement, status, and reference to the Architect session. Execution state is retained in Temporal, and detailed reports, logs, checks and committed work are retained in artifacts and Git. The Architect follows references to the original execution and reads the relevant report or log excerpts into its conversational context. Acknowledgements and references remain part of the MCP exchange; complete reports are not automatically copied into chat. The drawing explains a reporting policy; it does not measure message or token savings.</desc>
  <defs>
    <marker id="report-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#52675b"/></marker>
    <marker id="evidence-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#b65f32"/></marker>
    <style>
      .bg{fill:#faf9f4}.card{fill:#fffefa;stroke:#bfc8bd;stroke-width:1.5}.actor{fill:#f0eee4;stroke:#bfc8bd;stroke-width:1.5}.title{font:700 23px system-ui,sans-serif;fill:#243e35;text-anchor:middle}.label{font:600 18px system-ui,sans-serif;fill:#243e35;text-anchor:middle}.small{font:14px system-ui,sans-serif;fill:#52675b;text-anchor:middle}.path-label{font:15px system-ui,sans-serif;fill:#52675b}.msg{fill:none;stroke:#52675b;stroke-width:2.5;marker-end:url(#report-arrow)}.fetch,.fetchBranch{fill:none;stroke:#b65f32;stroke-width:2.5;stroke-dasharray:7 5}.fetch{marker-end:url(#evidence-arrow)}
    </style>
  </defs>
  <rect class="bg" width="760" height="550" rx="12"/>
  <text class="title" x="380" y="39">Concise messages, relevant evidence</text>
  <rect class="actor" x="30" y="115" width="190" height="95" rx="10"/>
  <text class="label" x="125" y="168">Worker</text>
  <rect class="actor" x="540" y="115" width="190" height="95" rx="10"/>
  <text class="label" x="635" y="158"><tspan x="635">Architect</tspan><tspan x="635" dy="24">session</tspan></text>
  <path class="msg" d="M220 163H540"/>
  <text class="small" x="380" y="143">ACK / status / ref</text>
  <path class="msg" d="M125 210V396H252"/>
  <path class="msg" d="M125 396V478H252"/>
  <text class="path-label" x="147" y="267"><tspan x="147">Record state</tspan><tspan x="147" dy="21">and evidence</tspan></text>
  <text class="label" x="380" y="326">Retained records</text>
  <rect class="card" x="252" y="353" width="256" height="68" rx="9"/>
  <text class="label" x="380" y="380">Temporal execution</text>
  <text class="small" x="380" y="404">Status · summaries · artifact refs</text>
  <rect class="card" x="252" y="444" width="256" height="68" rx="9"/>
  <text class="label" x="380" y="471">Artifacts / Git</text>
  <text class="small" x="380" y="495">Reports · logs · checks · commits</text>
  <path class="msg" d="M540 185H480V353"/>
  <text class="path-label" x="285" y="267"><tspan x="285">Read original run</tspan><tspan x="285" dy="21">and evidence refs</tspan></text>
  <path class="fetch" d="M508 396H635V210"/>
  <path class="fetchBranch" d="M508 478H635V396"/>
  <text class="path-label" x="650" y="267"><tspan x="650">Selected</tspan><tspan x="650" dy="21">evidence</tspan></text>
</svg>
